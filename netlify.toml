[build]
  publish = "."
  command = ""

# Every route is a real prerendered file (/splits/index.html, /david-goggins-volume-base/index.html …),
# so there is no SPA catch-all: unknown paths get a real 404 instead of a 200 with the wrong content.
# Adding a program to programs.js therefore requires re-running the prerender.

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/programs.js"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/support.js"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
